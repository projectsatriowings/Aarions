<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Aarions</title>
  <meta name="robots" content="noindex, follow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #FFF8EC;
      color: #2D1F17;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      background: rgba(232, 163, 23, 0.12);
      border: 1px solid rgba(232, 163, 23, 0.35);
      color: #C8870F;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-family: Georgia, serif;
      font-weight: 700;
      color: #2D1F17;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    p {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: rgba(45, 31, 23, 0.75);
      max-width: 480px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .btn-primary {
      background: #2D1F17;
      color: #FFF8EC;
    }
    .btn-primary:hover {
      background: #8B1E1A;
    }
    .btn-secondary {
      background: #FFFFFF;
      color: #2D1F17;
      border: 1px solid rgba(45, 31, 23, 0.2);
    }
    .btn-secondary:hover {
      border-color: #E8A317;
      color: #E8A317;
    }
  </style>
</head>
<body>
  <div class="badge">404 Error</div>
  <h1>Page Not Found</h1>
  <p>The page you requested does not exist or has been moved. Discover our collection of pure honey, ghee, and organic spices.</p>
  <div class="btn-group">
    <a href="/" class="btn btn-primary">Return Home</a>
    <a href="/shop" class="btn btn-secondary">Explore Products</a>
  </div>
</body>
</html>
