# =====================================================================
# Complete Production Nginx Configuration for Aarions Ecosystem
# Target Path on Ubuntu VPS: /etc/nginx/sites-available/aarions
# Covers: Storefront (aarions.in / www.aarions.in), Admin, API Gateway
# =====================================================================

# -------------------------------------------------------------
# 1. Main Storefront (aarions.in and www.aarions.in) - HTTPS
# -------------------------------------------------------------
server {
    server_name aarions.in www.aarions.in;

    root /var/www/aarions-products/user/dist;
    index index.html;

    # Security Headers (HSTS, nosniff, Referrer-Policy, CSP, Frameguard)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://accounts.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.aarions.in https://www.google-analytics.com https://analytics.google.com https://*.razorpay.com https://accounts.google.com; frame-src 'self' https://accounts.google.com https://api.razorpay.com; object-src 'none'; base-uri 'self';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Caching for immutable static build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static WebP & media files
    location ~* \.(?:webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Verification files (ads.txt, robots.txt, sitemap.xml)
    location = /ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* ^/google[a-f0-9]+\.html$ {
        default_type text/html;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aarions.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aarions.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# -------------------------------------------------------------
# 2. Admin Panel (admin.aarions.in) - HTTPS
# -------------------------------------------------------------
server {
    server_name admin.aarions.in;

    root /var/www/aarions-products/admin/dist;
    index index.html;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.aarions.in; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self';" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aarions.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aarions.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# -------------------------------------------------------------
# 3. Backend API Gateway (api.aarions.in) - HTTPS
# -------------------------------------------------------------
server {
    server_name api.aarions.in;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aarions.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aarions.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# -------------------------------------------------------------
# 4. HTTP Port 80 Redirects to HTTPS
# -------------------------------------------------------------
server {
    listen 80;
    server_name aarions.in www.aarions.in;
    return 301 https://www.aarions.in$request_uri;
}

server {
    listen 80;
    server_name admin.aarions.in;
    return 301 https://admin.aarions.in$request_uri;
}

server {
    listen 80;
    server_name api.aarions.in;
    return 301 https://api.aarions.in$request_uri;
}
