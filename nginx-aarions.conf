# =====================================================================
# Nginx Configuration for Aarions (https://www.aarions.in)
# Location on Ubuntu: /etc/nginx/sites-available/aarions
# =====================================================================

# 1. HTTP Redirect to Canonical HTTPS WWW
server {
    listen 80;
    listen [::]:80;
    server_name aarions.in www.aarions.in;
    return 301 https://www.aarions.in$request_uri;
}

# 2. HTTPS Apex (aarions.in) Redirect to Canonical HTTPS WWW
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aarions.in;

    # SSL Certificates (managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/aarions.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aarions.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 301 Permanent Redirect to canonical www
    return 301 https://www.aarions.in$request_uri;
}

# 3. Main Canonical Server Block (https://www.aarions.in)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aarions.in;

    # Root directory pointing to built frontend
    root /var/www/aarions-products/user/dist;
    index index.html;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/aarions.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aarions.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers (HSTS, MIME sniff protection, Frameguard)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Long-Lived Caching (JS, CSS, WebP, Images, Fonts)
    location ~* \.(?:js|css|webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Text & XML verification files (ads.txt, robots.txt, sitemap.xml)
    location = /ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* ^/google[a-f0-9]+\.html$ {
        default_type text/html;
        add_header Cache-Control "public, max-age=86400";
    }

    # Dedicated True 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to Node.js Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000; # Adjust port if backend runs on different port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

